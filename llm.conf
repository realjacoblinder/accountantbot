{
    "llm": {
        "model": "gemma-4-26B-A4B",
        "api_base": "http://127.0.0.1:8080/v1",
        "temperature": 0.5,
        "timeout": 600,
        "max_tokens": 16384,
        "reasoning_effort": "medium"
    },
    "embeddings": {
        "model": "embeddinggemma-2-F16",
        "ingestion_model": "embeddinggemma-2-gpu",
        "api_base": "http://127.0.0.1:8080/v1",
        "batch_size": 32,
        "parallel_requests": 4,
        "max_input_tokens": 2048,
        "tax_code_chunk_tokens": 512,
        "tax_code_overlap_tokens": 64,
        "general_chunk_tokens": 384,
        "general_overlap_tokens": 48,
        "form_chunk_tokens": 1024,
        "form_overlap_tokens": 64,
        "query_api_base": "http://127.0.0.1:8081/v1"
    },
    "pdf_ingestion": {
        "render_dpi": 150,
        "max_image_edge": 2000,
        "image_directory": "data/user_page_images",
        "max_retrieved_pages": 4
    },
    "pdf_extraction": {
        "model": "gemma-4-E4B",
        "dpi": 300,
        "grid_size": 2,
        "max_tokens": 65536,
        "temperature": 0,
        "cache_directory": "data/user_extractions",
        "triage_dpi": 100,
        "triage_max_tokens": 1024,
        "region_padding": 0.02,
        "max_region_retries": 2,
        "max_region_area": 0.25,
        "crop_max_tokens": 4096
    }
}
