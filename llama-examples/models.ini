version = 1

; ==========================================
; Defaults for all models
; ==========================================

[*]
; GPU offloading
n-gpu-layers = auto
fit-target = 768

; CPU
threads = 6
threads-batch = 6

; KV cache
cache-type-k = q8_0
cache-type-v = q8_0
kv-unified = true

; Performance
flash-attn = on

; Tool calling
jinja = true

; Memory management
sleep-idle-seconds = 600

; Generation
batch-size = 1024
ubatch-size = 256

[gemma-4-26B-A4B]
model = $HOME/model-gguf/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
mmproj = $HOME/model-gguf/gemma-4-26b-it-qat-q4-k-xl-mmproj-f16.gguf
mmproj-offload = false
n-gpu-layers = all
fa = on
fit = off
n-cpu-moe = 28
ctx-size = 262144
parallel = 2
kv-unified-per-slot = 131072
n-predict = 65536

;spec-type = draft-mtp
;spec-draft-n-max = 2
;model-draft = $HOME/model-gguf/gemma-4-26b-it-qat-q4-k-xl-mtp.gguf

[gemma-4-E4B]
model = $HOME/model-gguf/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
mmproj = $HOME/model-gguf/gemma-4-E4B-it-qat-UD-Q4_K_XL-mmproj-fp16.gguf
mmproj-auto = true
cache-type-k = f16
cache-type-v = f16
ctx-size = 131072
n-predict = 65536
image-min-tokens = 1120
image-max-tokens = 1120

[embeddinggemma-2-gpu]
model = $HOME/model-gguf/embeddinggemma-2-F16.gguf
mmproj = $HOME/model-gguf/embeddinggemma-2-mmproj-F16.gguf
embedding = true
embd-normalize = 2
pooling = mean
device = CUDA0
n-gpu-layers = all
; Include the token embedding table in GPU residency.
override-tensor = .*=CUDA0
fit = off
flash-attn = on
cache-type-k = f16
cache-type-v = f16
parallel = 4
ctx-size = 8192
; Non-causal embedding inputs must fit in one microbatch.
batch-size = 2048
ubatch-size = 2048
sleep-idle-seconds = 15
