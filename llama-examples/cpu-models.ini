version = 1

; ==========================================
; Defaults for all models
; ==========================================

[*]
; CPU only
device = none
n-gpu-layers = 0
no-op-offload = true
no-kv-offload = true

; CPU
threads = 6
threads-batch = 6

; Memory management
sleep-idle-seconds = 600

[embeddinggemma-2-F16]
model = $HOME/model-gguf/embeddinggemma-2-F16.gguf
mmproj = $HOME/model-gguf/embeddinggemma-2-mmproj-F16.gguf
embedding = true
pooling = mean
fit = off
flash-attn = off
cache-type-k = f16
cache-type-v = f16
ctx-size = 2048
batch-size = 2048
parallel = 1
embd-normalize = 2
